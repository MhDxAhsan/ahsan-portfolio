<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08080b">
<meta name="description" content="Muhammad Ahsan — Graphic Designer, Web Developer and Shopify Store Designer.">
<title>Muhammad Ahsan | Creative Portfolio</title>

<style>
:root {
  --red: #ff263f;
  --bg: #08080b;
  --panel: #121218;
  --muted: #aaaab5;
  --white: #f5f5f7;
  --line: #ffffff20;
  --gold: #d6b579;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 75px;
}

body {
  background: var(--bg);
  color: var(--white);
  font-family: Arial, Helvetica, sans-serif;
  overflow-x: hidden;
}

body.locked {
  overflow: hidden;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

img {
  max-width: 100%;
}

::selection {
  background: var(--red);
  color: #fff;
}

.container {
  width: min(90%, 1180px);
  margin-inline: auto;
}

.red,
.name {
  color: var(--red);
}

/* ANIMATIONS */

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-9px); }
}

@keyframes blink {
  50% { opacity: 0; }
}

@keyframes slideFade {
  from {
    opacity: .3;
    transform: translateX(8px) scale(1.03);
  }
  to {
    opacity: 1;
    transform: translateX(0) scale(1);
  }
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes loadline {
  from { transform: translateX(-100%); }
  to { transform: translateX(0); }
}

/* LOADER */

#loader {
  position: fixed;
  inset: 0;
  z-index: 2000;
  display: grid;
  place-items: center;
  background: var(--bg);
  transition: opacity .4s, visibility .4s;
}

#loader.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.loader-inner {
  text-align: center;
}

.loader-logo {
  font-size: 46px;
  font-weight: 900;
  color: var(--red);
  text-shadow: 0 0 24px #ff263f66;
}

.loader-line {
  width: 170px;
  height: 3px;
  margin: 16px auto;
  background: #29292f;
  overflow: hidden;
}

.loader-line::after {
  content: "";
  display: block;
  height: 100%;
  background: var(--red);
  animation: loadline 1s ease both;
}

.loader-inner p {
  font-size: 10px;
  letter-spacing: 4px;
  color: #aaa;
}

/* NAVIGATION */

nav {
  width: 90%;
  max-width: 1180px;
  height: 76px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #ffffff15;
}

.logo {
  font-size: 28px;
  font-weight: 900;
  letter-spacing: -2px;
}

.logo span {
  color: var(--red);
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 22px;
  color: #ccc;
  font-size: 13px;
}

.nav-links a:hover {
  color: var(--red);
}

.nav-contact {
  padding: 10px 14px;
  border: 1px solid #ff263f88;
  border-radius: 4px;
}

/* SHARED SECTIONS */

.section {
  padding: 85px 0;
  border-top: 1px solid #ffffff12;
}

.section-top {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 25px;
  margin-bottom: 36px;
}

.section-label,
.eyebrow {
  color: var(--red);
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 16px;
}

h1 {
  font-size: clamp(42px, 6vw, 76px);
  line-height: 1.05;
  letter-spacing: -3px;
}

h2 {
  font-size: clamp(30px, 4vw, 46px);
  line-height: 1.15;
  letter-spacing: -2px;
}

.section-description {
  max-width: 440px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.9;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 25px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 13px 19px;
  border: 1px solid #ffffff35;
  border-radius: 4px;
  background: transparent;
  color: #fff;
  font-size: 13px;
  font-weight: bold;
  transition: transform .25s, box-shadow .25s;
}

.btn.primary {
  border-color: var(--red);
  background: var(--red);
}

.btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 30px #ff263f30;
}

/* HERO AND TYPING ANIMATION */

.hero {
  width: 90%;
  max-width: 1180px;
  min-height: 610px;
  margin: auto;
  padding: 65px 0 75px;
  display: grid;
  grid-template-columns: 1.05fr .95fr;
  align-items: center;
  gap: 45px;
}

.hero-copy {
  min-width: 0;
}

.hero-text {
  max-width: 510px;
  min-height: 6em;
  margin-top: 23px;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.9;
}

.hero-note {
  margin-top: 28px;
  color: #777;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.typing-active::after {
  content: "";
  display: inline-block;
  width: 2px;
  height: .88em;
  margin-left: 4px;
  vertical-align: -.04em;
  background: var(--red);
  animation: blink .8s steps(2, start) infinite;
}

/* PROFILE PICTURE */

.visual {
  position: relative;
  width: 100%;
  max-width: 440px;
  justify-self: center;
}

.photo-wrap {
  position: relative;
  z-index: 2;
  width: 84%;
  aspect-ratio: 4 / 5;
  margin: auto;
  overflow: hidden;
  border: 1px solid #ff263f66;
  border-radius: 48% 48% 8px 8px;
  background: linear-gradient(145deg, #301018, #141419);
  box-shadow: 0 25px 80px #ff263f25;
  animation: float 5s ease-in-out infinite;
}

.photo-wrap img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.orbit {
  position: absolute;
  width: 105%;
  height: 65%;
  top: 17%;
  left: -2.5%;
  border: 1px solid #ff263f80;
  border-radius: 50%;
  pointer-events: none;
  animation: spin 16s linear infinite;
}

.orbit.two {
  width: 115%;
  height: 75%;
  top: 12%;
  left: -7.5%;
  border-color: #ffffff25;
  animation-duration: 24s;
  animation-direction: reverse;
}

.glow {
  position: absolute;
  top: 15%;
  left: 13%;
  width: 75%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: #ff263f30;
  filter: blur(65px);
}

.photo-label {
  position: absolute;
  z-index: 3;
  bottom: 8%;
  left: 0;
  padding: 14px 18px;
  border: 1px solid #ffffff20;
  background: #111116ed;
}

.photo-label strong {
  display: block;
  font-size: 13px;
}

.photo-label small {
  display: block;
  margin-top: 5px;
  color: #aaa;
  font-size: 10px;
  letter-spacing: 1px;
}

/* ABOUT */

.about-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: 45px;
}

.about-copy p {
  margin-top: 17px;
  color: var(--muted);
  font-size: 15px;
  line-height: 2;
}

.about-panel {
  padding: 25px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: linear-gradient(145deg, #17171e, #0d0d12);
}

.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.stat {
  padding: 20px;
  border: 1px solid #ffffff16;
  background: #08080b88;
}

.stat strong {
  display: block;
  color: var(--red);
  font-size: 26px;
  margin-bottom: 8px;
}

.stat span {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}

/* SERVICES */

.cards {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.card {
  padding: 27px;
  min-height: 205px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: linear-gradient(145deg, #141419, #0d0d11);
  transition: transform .3s, border-color .3s;
}

.card:hover {
  transform: translateY(-7px);
  border-color: #ff263f80;
}

.card-number {
  color: var(--red);
  font-size: 11px;
  letter-spacing: 2px;
}

.card h3 {
  margin: 25px 0 12px;
  font-size: 21px;
}

.card p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.9;
}

/* PROJECT CARDS */

.projects-section {
  background: radial-gradient(ellipse at 50% 0%, #ff263f0a, transparent 60%);
}

.project-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
  align-items: stretch;
}

.project-card {
  position: relative;
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  text-align: left;
  color: #fff;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #111116;
  transition: transform .3s, border-color .3s, box-shadow .3s;
}

.project-card:hover,
.project-card:focus-visible {
  transform: translateY(-6px);
  border-color: var(--red);
  box-shadow: 0 18px 45px #0008;
  outline: none;
}

button.project-card {
  width: 100%;
  appearance: none;
  padding: 0;
}

.project-thumb {
  position: relative;
  isolation: isolate;
  aspect-ratio: 4 / 3;
  overflow: hidden;
  background: #17171d;
}

.project-thumb > img:not([hidden]) {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .45s, opacity .25s;
}

.project-thumb > img[hidden] {
  display: none;
}

.project-fallback {
  position: absolute;
  z-index: 0;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 20px;
  text-align: center;
  background: radial-gradient(circle, #ff263f24, #111116 70%);
  pointer-events: none;
}

.project-fallback .symbol {
  color: var(--red);
  font-size: 42px;
}

.project-fallback h3 {
  font-size: 19px;
}

.project-fallback small {
  color: #aaa;
  font-size: 11px;
}

.project-open {
  position: absolute;
  z-index: 5;
  top: 13px;
  right: 13px;
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: 1px solid #ffffff35;
  border-radius: 50%;
  background: #08080bdd;
  font-size: 20px;
  transition: .3s;
}

.project-card:hover .project-open {
  background: var(--red);
  transform: rotate(45deg);
}

.project-info {
  flex: 1;
  padding: 20px;
}

.project-category {
  color: var(--red);
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.project-info h3 {
  margin: 10px 0;
  font-size: 19px;
  transition: transform .3s;
}

.project-card:hover .project-info h3 {
  transform: translateX(3px);
}

.project-info p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.8;
}

.project-cta {
  margin-top: 15px;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.project-card::after {
  content: "";
  position: absolute;
  inset: -120% -40%;
  z-index: 4;
  pointer-events: none;
  opacity: 0;
  transform: translateX(-55%) rotate(18deg);
  background: linear-gradient(90deg, transparent, #ffffff0b, transparent);
  transition: opacity .3s, transform .85s;
}

.project-card:hover::after {
  opacity: 1;
  transform: translateX(55%) rotate(18deg);
}

/* GRAPHIC DESIGN SLIDESHOW */

.graphic-card .project-thumb > img.slide-change {
  animation: slideFade .42s ease;
}

/* RESTAURANT WEBSITE PROJECT PREVIEW */

.grilli-thumb {
  background: #100d09;
}

.grilli-showcase {
  position: absolute;
  inset: 0;
  overflow: hidden;
  padding: 16px 18px;
  color: #f7ead2;
  background: linear-gradient(135deg, #19140f, #080809 68%, #21160d);
  font-family: Georgia, "Times New Roman", serif;
}

.grilli-showcase::before {
  content: "";
  position: absolute;
  width: 58%;
  aspect-ratio: 1;
  right: -9%;
  top: 15%;
  border: 1px solid #caa56a65;
  border-radius: 50%;
  box-shadow: 0 0 0 11px #caa56a0d, 0 0 0 24px #caa56a08;
}

.grilli-showcase::after {
  content: "";
  position: absolute;
  inset: auto 0 0;
  height: 28%;
  background: linear-gradient(0deg, #090909d9, transparent);
}

.grilli-topline {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  color: var(--gold);
  border-bottom: 1px solid #d4b68142;
  padding-bottom: 9px;
  font-family: Arial, sans-serif;
}

.grilli-topline span:first-child {
  font-size: 23px;
  font-weight: 700;
  font-family: Georgia, serif;
}

.grilli-topline span:last-child {
  font-size: 7px;
  letter-spacing: 1px;
}

.grilli-hero-copy {
  position: absolute;
  z-index: 2;
  top: 35%;
  left: 8%;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
}

.grilli-kicker {
  color: var(--gold);
  font: 7px/1.5 Arial, sans-serif;
  letter-spacing: 1.5px;
}

.grilli-hero-copy strong {
  color: #fff2db;
  font-size: clamp(34px, 6vw, 56px);
  line-height: 1;
  letter-spacing: 2px;
  text-shadow: 0 4px 30px #000;
}

.grilli-rule {
  width: 55px;
  height: 2px;
  background: var(--gold);
}

.grilli-subtitle {
  color: #ddd0ba;
  font: 7px Arial, sans-serif;
  letter-spacing: 2px;
}

.grilli-preview-button {
  margin-top: 8px;
  padding: 7px 10px;
  border: 1px solid #d4b6819c;
  color: #f6e4c4;
  font: 7px Arial, sans-serif;
  letter-spacing: 1px;
}

.grilli-plate {
  position: absolute;
  z-index: 1;
  width: 38%;
  aspect-ratio: 1;
  right: 7%;
  top: 30%;
  display: grid;
  place-items: center;
  border: 7px double #d7c7ac45;
  border-radius: 50%;
  background: radial-gradient(circle, #6e4a21 0 20%, #2d2117 21% 35%, #0d0d0e 36% 59%, #211a15 60%);
  box-shadow: 0 12px 30px #000a;
  transform: rotate(-14deg);
  transition: transform .5s;
}

.grilli-plate span {
  color: #d9b46f;
  font-size: 31px;
}

.grilli-project-card:hover .grilli-plate {
  transform: rotate(0) scale(1.04);
}

.grilli-deco {
  position: absolute;
  z-index: 2;
  color: var(--gold);
  opacity: .7;
}

.grilli-deco-one {
  top: 22%;
  right: 20%;
  font-size: 17px;
}

.grilli-deco-two {
  bottom: 12%;
  right: 14%;
  font-size: 23px;
}

.grilli-tech {
  margin-top: 13px;
  color: #b9b9c4;
  font-size: 11px;
  letter-spacing: .7px;
}

.grilli-link-row {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 16px;
}

.grilli-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 10px 15px;
  border: 1px solid #ffffff35;
  border-radius: 4px;
  background: #17171d;
  color: #f5f5f7;
  font-size: 12px;
  font-weight: 700;
  transition: background .25s, border-color .25s, transform .25s;
}

.grilli-link:hover {
  border-color: var(--red);
  background: var(--red);
  transform: translateY(-2px);
}

/* SHOPIFY PREVIEW */

.shopify-card .project-thumb {
  aspect-ratio: 16 / 10;
}

.shopify-card .project-thumb > img:not([hidden]) {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 1;
  width: 100%;
  height: auto;
  min-height: 100%;
  object-fit: initial;
  object-position: top center;
  transform: translateY(0);
  transition: transform 4s linear;
}

.shopify-card .project-thumb:hover > img:not([hidden]) {
  transform: translateY(var(--scroll-distance, 0px));
}

/* SKILLS */

.skill-layout {
  display: grid;
  grid-template-columns: .8fr 1.2fr;
  gap: 45px;
}

.skill-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.skill-tags span {
  padding: 11px 14px;
  border: 1px solid #ffffff25;
  border-radius: 3px;
  color: #ddd;
  font-size: 12px;
}

.skill-bars {
  display: grid;
  gap: 22px;
}

.skill-line-head {
  display: flex;
  justify-content: space-between;
  margin-bottom: 9px;
  font-size: 13px;
}

.skill-line-head span:last-child {
  color: var(--muted);
}

.skill-track {
  height: 5px;
  overflow: hidden;
  border-radius: 10px;
  background: #ffffff14;
}

.skill-fill {
  height: 100%;
  width: var(--level);
  border-radius: 10px;
  background: linear-gradient(90deg, #ff263f, #ff7787);
}

/* PROCESS */

.process-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
}

.process-step {
  padding: 24px 20px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: linear-gradient(145deg, #141419, #0d0d11);
  transition: transform .3s, border-color .3s;
}

.process-step:hover {
  transform: translateY(-5px);
  border-color: #ff263f80;
}

.process-step .step {
  color: var(--red);
  font-size: 12px;
  letter-spacing: 2px;
}

.process-step h3 {
  margin: 22px 0 10px;
  font-size: 18px;
}

.process-step p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.8;
}

/* CONTACT */

.contact-area {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 30px;
  padding: clamp(28px, 6vw, 65px);
  border: 1px solid var(--line);
  border-radius: 8px;
  background: radial-gradient(ellipse at 85% 50%, #ff263
