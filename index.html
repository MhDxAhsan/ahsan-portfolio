
<!--
PART 1: CSS
Find the old .modal-gallery rules in your <style>.
Replace those rules with the CSS below.
-->

<style>
.gallery-viewer {
  width: 100%;
  min-width: 0;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.gallery-stage {
  width: 100%;
  height: min(58vh, 560px);
  min-height: 260px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #09090c;
  border-radius: 8px;
}

.gallery-stage img {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
}

.gallery-error {
  padding: 20px;
  color: var(--muted);
  text-align: center;
  font-size: 13px;
}

.gallery-controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.gallery-controls button {
  padding: 11px 15px;
  border: 1px solid #ffffff35;
  border-radius: 5px;
  background: #17171d;
  color: white;
  font-size: 12px;
  transition: background .25s, border-color .25s;
}

.gallery-controls button:hover {
  background: var(--red);
  border-color: var(--red);
}

.gallery-counter {
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}

@media (max-width: 600px) {
  .gallery-viewer {
    padding: 10px;
  }

  .gallery-stage {
    height: 42vh;
    min-height: 220px;
  }

  .gallery-controls button {
    padding: 10px;
  }
}
</style>


<!--
PART 2: JAVASCRIPT
Inside your existing <script>, replace the COMPLETE
openProject(card) function with this function.
Do not remove closeProject() or the existing event listeners.
-->

<script>
function openProject(card) {
  lastTrigger = card;

  modalTitle.textContent = card.dataset.title || "Project";
  modalCategory.textContent = card.dataset.category || "PROJECT";
  modalDescription.textContent = card.dataset.description || "";
  modalVisual.replaceChildren();

  if (
    card.dataset.projectType === "gallery" ||
    card.dataset.title === "Graphic Design"
  ) {
    const imageFiles = [
      "image%201.jpeg",
      "image%202.jpeg",
      "image%203.jpeg",
      "image%204.jpeg",
      "image%205.jpeg",
      "image%206.jpeg",
      "image%207.jpeg",
      "image%208.jpeg",
      "image%209.jpeg",
      "image%2010.jpeg",
      "image%2012.jpeg",
      "image%2013.jpeg"
    ];

    const viewer = document.createElement("div");
    viewer.className = "gallery-viewer";

    const stage = document.createElement("div");
    stage.className = "gallery-stage";

    const image = document.createElement("img");
    image.alt = "Graphic design work";
    image.loading = "eager";

    const error = document.createElement("p");
    error.className = "gallery-error";
    error.hidden = true;

    stage.append(image, error);

    const controls = document.createElement("div");
    controls.className = "gallery-controls";

    const previous = document.createElement("button");
    previous.type = "button";
    previous.textContent = "← Previous";
    previous.setAttribute(
      "aria-label",
      "Previous graphic design image"
    );

    const counter = document.createElement("span");
    counter.className = "gallery-counter";
    counter.setAttribute("aria-live", "polite");

    const next = document.createElement("button");
    next.type = "button";
    next.textContent = "Next →";
    next.setAttribute(
      "aria-label",
      "Next graphic design image"
    );

    controls.append(previous, counter, next);
    viewer.append(stage, controls);
    modalVisual.appendChild(viewer);

    let currentIndex = 0;

    image.onload = function () {
      image.style.display = "block";
      error.hidden = true;
    };

    image.onerror = function () {
      image.style.display = "none";
      error.hidden = false;
      error.textContent =
        "Image not found: " +
        image.dataset.requestedSrc +
        ". Check the filename in your repository.";
    };

    function showImage(newIndex) {
      currentIndex =
        (newIndex + imageFiles.length) % imageFiles.length;

      const src = imageFiles[currentIndex];

      error.hidden = true;
      image.style.display = "block";
      image.alt =
        "Graphic design work " + (currentIndex + 1);

      image.dataset.requestedSrc = src;
      image.src = src;

      counter.textContent =
        (currentIndex + 1) + " / " + imageFiles.length;
    }

    previous.addEventListener("click", function () {
      showImage(currentIndex - 1);
    });

    next.addEventListener("click", function () {
      showImage(currentIndex + 1);
    });

    showImage(0);

  } else {
    const fallback = document.createElement("div");
    fallback.className = "modal-fallback";
    fallback.textContent =
      "Project preview coming soon. Add the correct " +
      "Web Development or Shopify screenshot here.";

    modalVisual.appendChild(fallback);
  }

  modalVisit.hidden = true;
  modalVisit.removeAttribute("href");

  modal.classList.add("open");
  modal.setAttribute("aria-hidden", "false");
  document.body.classList.add("locked");

  closeButton.focus();
}
</script>
