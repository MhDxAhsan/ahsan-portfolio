<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08080b">
<meta name="description" content="Muhammad Ahsan — Graphic Designer, Web Developer and Shopify Store Designer.">
<title>Muhammad Ahsan | Creative Portfolio</title>

<style>
:root {
  --red: #ff263f;
  --bg: #08080b;
  --panel: #121218;
  --muted: #aaaab5;
  --white: #f5f5f7;
  --line: #ffffff1c;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 84px;
}

body {
  background: var(--bg);
  color: var(--white);
  font-family: Arial, Helvetica, sans-serif;
  overflow-x: hidden;
}

body.locked {
  overflow: hidden;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

::selection {
  background: var(--red);
  color: white;
}

.container {
  width: min(90%, 1180px);
  margin: auto;
}

.red {
  color: var(--red);
}

/* LOADER AND ANIMATIONS */

#loader {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: grid;
  place-items: center;
  background: var(--bg);
  transition: opacity .45s, visibility .45s;
}

#loader.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.loader-logo {
  font-size: 48px;
  font-weight: 900;
  color: var(--red);
  animation: glow 1s infinite alternate;
}

.loader-line {
  height: 3px;
  width: 175px;
  margin: 16px auto;
  background: #29292f;
  overflow: hidden;
}

.loader-line:after {
  content: "";
  display: block;
  height: 100%;
  background: var(--red);
  animation: load 1.2s ease;
}

.loader-inner p {
  text-align: center;
  color: #aaa;
  font-size: 10px;
  letter-spacing: 4px;
}

@keyframes load {
  from { transform: translateX(-100%); }
  to { transform: translateX(0); }
}

@keyframes glow {
  to { text-shadow: 0 0 30px #ff263f99; }
}

@keyframes float {
  0%, 100% { transform: translateY(0) rotateY(-4deg); }
  50% { transform: translateY(-12px) rotateY(4deg); }
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes popIn {
  from { opacity: 0; transform: translateY(10px) scale(.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* NAVIGATION */

nav {
  width: 90%;
  max-width: 1180px;
  height: 78px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #ffffff15;
  position: relative;
  z-index: 10;
}

.logo {
  font-size: 28px;
  font-weight: 900;
  letter-spacing: -2px;
}

.logo span,
footer b {
  color: var(--red);
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 24px;
  font-size: 13px;
  color: #ccc;
}

.nav-links a {
  transition: color .25s;
}

.nav-links a:hover {
  color: var(--red);
}

.nav-contact {
  border: 1px solid #ff263f88;
  padding: 11px 15px;
  border-radius: 4px;
}

/* BUTTONS AND SECTIONS */

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 13px;
  margin-top: 28px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 14px 21px;
  border: 1px solid #ffffff35;
  border-radius: 4px;
  background: transparent;
  color: white;
  font-size: 13px;
  font-weight: bold;
  transition: transform .3s, box-shadow .3s, background .3s;
}

.btn.primary {
  background: var(--red);
  border-color: var(--red);
}

.btn:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 30px #ff263f30;
}

.section {
  padding: 95px 0;
  border-top: 1px solid #ffffff12;
}

.section-top {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 25px;
  margin-bottom: 40px;
}

.eyebrow,
.section-label {
  color: var(--red);
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 18px;
}

h1 {
  font-size: clamp(43px, 6vw, 78px);
  line-height: 1.04;
  letter-spacing: -4px;
}

h2 {
  font-size: clamp(30px, 4vw, 46px);
  line-height: 1.15;
  letter-spacing: -2px;
}

.section-description {
  max-width: 440px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.9;
}

/* HERO AND PORTRAIT */

.hero {
  width: 90%;
  max-width: 1180px;
  min-height: 640px;
  margin: auto;
  padding: 65px 0 80px;
  display: grid;
  grid-template-columns: 1.05fr .95fr;
  align-items: center;
  gap: 45px;
}

.name {
  display: block;
  color: var(--red);
}

.hero-text {
  margin-top: 24px;
  max-width: 510px;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.9;
}

.hero-note {
  margin-top: 30px;
  color: #777;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.visual {
  position: relative;
  max-width: 450px;
  width: 100%;
  justify-self: center;
  perspective: 1000px;
}

.photo-wrap {
  width: 84%;
  aspect-ratio: 4/5;
  margin: auto;
  position: relative;
  z-index: 2;
  overflow: hidden;
  border-radius: 48% 48% 8px 8px;
  border: 1px solid #ff263f66;
  background: linear-gradient(145deg, #301018, #141419);
  box-shadow: 0 25px 80px #ff263f25;
  animation: float 5s ease-in-out infinite;
}

.photo-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform .5s;
}

.photo-wrap:hover img {
  transform: scale(1.05);
}

.orbit {
  position: absolute;
  width: 105%;
  height: 65%;
  left: -2.5%;
  top: 17%;
  border: 1px solid #ff263f80;
  border-radius: 50%;
  animation: spin 16s linear infinite;
  pointer-events: none;
}

.orbit.two {
  width: 115%;
  height: 75%;
  left: -7.5%;
  top: 12%;
  border-color: #ffffff25;
  animation-duration: 24s;
  animation-direction: reverse;
}

.glow {
  position: absolute;
  width: 75%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: #ff263f30;
  filter: blur(65px);
  top: 15%;
  left: 13%;
}

.photo-label {
  position: absolute;
  z-index: 3;
  bottom: 8%;
  left: 0;
  padding: 14px 18px;
  background: #111116ed;
  border: 1px solid #ffffff20;
}

.photo-label strong {
  display: block;
  font-size: 13px;
}

.photo-label small {
  display: block;
  margin-top: 5px;
  color: #aaa;
  font-size: 10px;
  letter-spacing: 1px;
}

/* ABOUT AND SERVICES */

.about-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: 45px;
}

.about-copy p {
  margin-top: 17px;
  color: var(--muted);
  font-size: 15px;
  line-height: 2;
}

.about-panel {
  padding: 28px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: linear-gradient(145deg, #17171e, #0d0d12);
}

.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.stat {
  padding: 20px;
  border: 1px solid #ffffff16;
  background: #08080b88;
}

.stat strong {
  display: block;
  color: var(--red);
  font-size: 27px;
  margin-bottom: 8px;
}

.stat span {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}

.cards {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.card {
  position: relative;
  overflow: hidden;
  padding: 29px;
  min-height: 220px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: linear-gradient(145deg, #141419, #0d0d11);
  transition: transform .35s, border-color .35s;
}

.card:after {
  content: "";
  position: absolute;
  width: 140px;
  height: 140px;
  right: -90px;
  top: -90px;
  border-radius: 50%;
  background: #ff263f20;
  filter: blur(18px);
  transition: .4s;
}

.card:hover {
  transform: translateY(-8px);
  border-color: #ff263f80;
}

.card:hover:after {
  transform: scale(2);
}

.card-number {
  color: var(--red);
  font-size: 11px;
  letter-spacing: 2px;
}

.card h3 {
  margin: 28px 0 12px;
  font-size: 21px;
}

.card p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.9;
}

/* PROJECTS */

.projects-section {
  background: radial-gradient(ellipse at 50% 0%, #ff263f0a, transparent 60%);
}

.project-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
}

.project-card {
  width: 100%;
  min-width: 0;
  display: block;
  text-align: left;
  color: white;
  background: #111116;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  transition: transform .35s, border-color .35s, box-shadow .35s;
}

button.project-card {
  appearance: none;
  padding: 0;
  font: inherit;
}

.project-card:hover,
.project-card:focus-visible {
  transform: translateY(-8px);
  border-color: var(--red);
  box-shadow: 0 18px 45px #0008;
  outline: none;
}

.project-thumb {
  position: relative;
  aspect-ratio: 4/3;
  overflow: hidden;
  background: #17171d;
}

.project-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform .6s;
}

.project-thumb img[hidden] {
  display: none;
}

.project-card:hover .project-thumb img {
  transform: scale(1.04);
}

.project-fallback {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 20px;
  text-align: center;
  background: radial-gradient(circle, #ff263f24, #111116 70%);
  pointer-events: none;
}

.project-fallback .symbol {
  color: var(--red);
  font-size: 42px;
}

.project-fallback h3 {
  font-size: 19px;
}

.project-fallback small {
  color: #aaa;
  font-size: 11px;
}

/* Hide placeholder only when a real image successfully loads */
.project-thumb img:not([hidden]) {
  position: relative;
  z-index: 1;
}

.project-open {
  position: absolute;
  top: 13px;
  right: 13px;
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #08080bdd;
  border: 1px solid #ffffff35;
  font-size: 20px;
  transition: .3s;
  z-index: 2;
}

.project-card:hover .project-open {
  background: var(--red);
  transform: rotate(45deg);
}

.project-info {
  padding: 20px;
}

.project-category {
  color: var(--red);
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.project-info h3 {
  margin: 10px 0;
  font-size: 19px;
}

.project-info p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.8;
}

.project-cta {
  margin-top: 15px;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.coming-soon {
  cursor: default;
}

.coming-soon:hover {
  transform: translateY(-3px);
  border-color: #ffffff35;
  box-shadow: none;
}

.coming-soon .project-open {
  display: none;
}

/* GRAPHIC DESIGN GALLERY: ONE IMAGE AT A TIME */

.gallery-viewer {
  width: 100%;
  min-width: 0;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.gallery-stage {
  width: 100%;
  height: min(58vh, 560px);
  min-height: 260px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #09090c;
  border-radius: 8px;
}

.gallery-stage img {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
}

.gallery-error {
  padding: 20px;
  color: var(--muted);
  text-align: center;
  font-size: 13px;
}

.gallery-controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.gallery-controls button {
  padding: 11px 15px;
  border: 1px solid #ffffff35;
  border-radius: 5px;
  background: #17171d;
  color: white;
  font-size: 12px;
  transition: background .25s, border-color .25s;
}

.gallery-controls button:hover {
  background: var(--red);
  border-color: var(--red);
}

.gallery-counter {
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}

/* SKILLS */

.skill-layout {
  display: grid;
  grid-template-columns: .8fr 1.2fr;
  gap: 45px;
}

.skill-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.skill-tags span {
  padding: 11px 14px;
  border: 1px solid #ffffff25;
  color: #ddd;
  font-size: 12px;
  border-radius: 3px;
  transition: .25s;
}

.skill-tags span:hover {
  border-color: var(--red);
  transform: translateY(-3px);
}

.skill-bars {
  display: grid;
  gap: 22px;
}

.skill-line-head {
  display: flex;
  justify-content: space-between;
  margin-bottom: 9px;
  font-size: 13px;
}

.skill-line-head span:last-child {
  color: var(--muted);
}

.skill-track {
  height: 5px;
  background: #ffffff14;
  border-radius: 10px;
  overflow: hidden;
}

.skill-fill {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #ff263f, #ff7787);
  transition: width 1.4s ease;
}

.reveal.visible .skill-fill {
  width: var(--level);
}

/* PROCESS AND CONTACT */

.process-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}

.process-step {
  padding: 24px 20px;
  border: 1px solid var(--line);
  background: linear-gradient(145deg, #141419, #0d0d11);
  border-radius: 5px;
  transition: .3s;
}

.process-step:hover {
  transform: translateY(-6px);
  border-color: #ff263f80;
}

.process-step .step {
  color: var(--red);
  font-size: 12px;
  letter-spacing: 2px;
}

.process-step h3 {
  margin: 22px 0 10px;
  font-size: 18px;
}

.process-step p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.8;
}

.contact-area {
  padding: clamp(28px, 6vw, 65px);
  border: 1px solid var(--line);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 30px;
  background: radial-gradient(ellipse at 85% 50%, #ff263f12, transparent 50%), #101014;
}

.contact-area p {
  margin-top: 15px;
  color: var(--muted);
  line-height: 1.8;
  font-size: 14px;
}

.contact-links {
  display: grid;
  gap: 12px;
  margin-top: 24px;
  font-size: 14px;
}

.contact-links a:hover {
  color: var(--red);
}

footer {
  padding: 28px 0;
  border-top: 1px solid #ffffff12;
  color: #777;
  font-size: 12px;
}

footer .container {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}

/* PROJECT VIEWER */

.project-modal {
  position: fixed;
  inset: 0;
  z-index: 1001;
  background: #000d;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow: auto;
}

.project-modal.open {
  display: flex;
}

.modal-panel {
  width: min(1050px, 100%);
  max-height: 90vh;
  overflow: auto;
  display: grid;
  grid-template-columns: 1.2fr .8fr;
  background: #111116;
  border: 1px solid #ffffff25;
  border-radius: 10px;
  box-shadow: 0 30px 100px #000b;
  animation: popIn .25s ease;
}

.modal-visual {
  min-height: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #09090c;
  overflow: auto;
}

.modal-visual > img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 85vh;
  object-fit: contain;
}

.modal-content {
  padding: clamp(24px, 4vw, 45px);
  align-self: center;
}

.modal-content h2 {
  margin-top: 14px;
}

.modal-content > p {
  margin-top: 17px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.9;
}

.modal-close {
  position: fixed;
  top: 18px;
  right: 22px;
  width: 44px;
  height: 44px;
  border: 1px solid #ffffff55;
  border-radius: 50%;
  background: #17171d;
  color: #fff;
  font-size: 30px;
  z-index: 1002;
}

.modal-fallback {
  padding: 28px;
  color: var(--muted);
  line-height: 1.7;
  text-align: center;
}

/* PORTFOLIO ASSISTANT */

.ai-launcher {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 900;
  width: 64px;
  height: 64px;
  border: 0;
  border-radius: 50%;
  background: var(--red);
  color: white;
  box-shadow: 0 10px 35px #ff263f55;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: transform .25s;
}

.ai-launcher:hover {
  transform: translateY(-4px) scale(1.04);
}

.ai-launcher span {
  font-size: 25px;
}

.ai-launcher small {
  font-size: 9px;
  font-weight: bold;
  letter-spacing: 2px;
}

.chat-panel {
  position: fixed;
  right: 24px;
  bottom: 100px;
  z-index: 901;
  width: min(370px, calc(100vw - 28px));
  height: min(540px, calc(100vh - 125px));
  display: none;
  flex-direction: column;
  overflow: hidden;
  background: #111116;
  border: 1px solid #ffffff25;
  border-radius: 12px;
  box-shadow: 0 25px 80px #000b;
}

.chat-panel.open {
  display: flex;
  animation: popIn .22s ease;
}

.chat-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px;
  border-bottom: 1px solid var(--line);
  background: #17171d;
}

.ai-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--red);
  font-weight: 900;
}

.chat-head-copy {
  display: grid;
  gap: 5px;
  flex: 1;
}

.chat-head-copy strong {
  font-size: 14px;
}

.chat-head-copy span {
  font-size: 10px;
  color: #9b9ba5;
}

.chat-close {
  border: 0;
  background: transparent;
  color: #fff;
  font-size: 27px;
}

.chat-messages {
  flex: 1;
  overflow: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.message {
  max-width: 92%;
  white-space: pre-line;
  padding: 11px 13px;
  border-radius: 10px;
  font-size: 12px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.message.bot {
  align-self: flex-start;
  background: #202027;
  color: #eee;
}

.message.user {
  align-self: flex-end;
  background: var(--red);
  color: white;
}

.quick-prompts {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 0 12px 12px;
}

.quick-prompts button {
  padding: 7px 10px;
  border-radius: 20px;
  border: 1px solid #ffffff30;
  background: transparent;
  color: #ddd;
  font-size: 11px;
}

.quick-prompts button:hover {
  border-color: var(--red);
}

.chat-form {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-top: 1px solid var(--line);
}

.chat-form input {
  min-width: 0;
  flex: 1;
  padding: 12px;
